name: CampusCollab CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript Verification
        run: bun run typecheck

      - name: Run Automated Test Suite
        run: bun test
        env:
          SESSION_SECRET: test_secure_session_secret_for_continuous_integration_64_bytes_len!
          ADMIN_EMAIL: admin@campuscollab.edu
          ADMIN_PASSKEY: test_admin_passkey_2026

      - name: Build Next.js Application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          SESSION_SECRET: test_secure_session_secret_for_continuous_integration_64_bytes_len!
          ADMIN_EMAIL: admin@campuscollab.edu
          ADMIN_PASSKEY: test_admin_passkey_2026
